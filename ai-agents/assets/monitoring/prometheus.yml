# Prometheus configuration for AI agent monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "ai-agent"
    static_configs:
      - targets: ["localhost:8080"]
    metrics_path: /metrics
    scheme: http

  - job_name: "qdrant"
    static_configs:
      - targets: ["localhost:6333"]
    metrics_path: /metrics

  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]
